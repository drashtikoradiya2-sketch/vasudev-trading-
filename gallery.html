<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Gallery - Vasudev Trading</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body{
            font-family: Arial;
            margin:0;
            background:#f5f5f5;
        }

        h1{
            text-align:center;
            margin-top:20px;
        }

        .gallery{
            width:90%;
            margin:30px auto;
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
            gap:15px;
        }

        .gallery img{
            width:100%;
            height:180px;
            object-fit:cover;
            border-radius:10px;
            transition:0.3s;
        }

        .gallery img:hover{
            transform:scale(1.05);
        }
    </style>
</head>

<body>

    <h1>📸 Our Gallery</h1>

    <div class="gallery">

        
        <img src="images/wheat.jpeg">
        <img src="images/chana.jpeg">
        <img src="images/bajro.jpeg">
        <img src="images/groundnut.jpeg">
        <img src="images/tuver.jpeg">
        <img src="images/makai.jpeg">
        <img src="images/kapas.jpeg">
        <img src="images/jiru.jpeg">
        <img src="images/mustard.jpeg">  
        <img src="images/tal.jpeg">
        <img src="images/dhana.jpeg">
        <img src="images/urad.jpeg">
        <img src="images/moong.jpeg">
        <img src="images/jowar.jpeg">
        <img src="images/rice.jpeg">
       



    </div>

</body>
</html>
