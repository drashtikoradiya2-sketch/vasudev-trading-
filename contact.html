<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us - Vasudev Trading</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f5f5f5;
        }

        ul{
            display:flex;
            list-style:none;
            gap:20px;
            justify-content:center;
            background:#006b22;
            padding:15px;
        }

        ul li a{
            color:white;
            text-decoration:none;
        }

        h1{
            text-align:center;
            margin-top:20px;
            color:#006b22;
        }

        .contact-box{
            width:80%;
            margin:40px auto;
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
            gap:20px;
        }

        .box{
            background:white;
            padding:20px;
            border-radius:10px;
            text-align:center;
            box-shadow:0 0 10px #ccc;
        }

        .box i{
            font-size:30px;
            color:#006b22;
            margin-bottom:10px;
        }

        a{
            text-decoration:none;
            color:black;
            font-weight:bold;
        }

        a:hover{
            color:#006b22;
        }
    </style>
</head>

<body>

        <h3>Phone</h3>

        <p>
            <a href="tel:+919879660985">+91 9879660985</a>
        </p>

        <p>
            <a href="tel:+919925780387">+91 9925780387</a>
