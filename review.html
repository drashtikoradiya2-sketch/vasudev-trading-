<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reviews - Vasudev Trading</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
        }

        .review-container{
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        .star {
            font-size: 25px;
            cursor: pointer;
            color: gray;
        }

        .active {
            color: gold;
        }

        input, textarea{
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button{
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        .review-box{
            margin-top: 15px;
            padding: 10px;
            background: #eee;
            border-radius: 8px;
        }

        h2{
            text-align:center;
        }

        .delete-btn{
            margin-top:10px;
            padding:5px 10px;
            background:red;
            color:white;
            border:none;
            cursor:pointer;
        }

    </style>
</head>

<body>

    <h2>⭐ Customer Reviews ⭐</h2>

    <div class="review-container">

        <input type="text" placeholder="Enter Name" class="review-input">

        <textarea placeholder="Write Review" class="review-text"></textarea>

        <br><br>

        <!-- Rating -->
        <div style="text-align:center;">
            <span class="star" onclick="rate(1)">★</span>
            <span class="star" onclick="rate(2)">★</span>
            <span class="star" onclick="rate(3)">★</span>
            <span class="star" onclick="rate(4)">★</span>
            <span class="star" onclick="rate(5)">★</span>
        </div>

        <button onclick="addReview()">Submit Review</button>

        <hr>

        <h3>All Reviews</h3>

        <div id="allReviews"></div>

    </div>

<script>

let selectedRating = 0;

function rate(r){
    selectedRating = r;

    let stars = document.querySelectorAll(".star");

    for(let i=0;i<stars.length;i++){
        stars[i].classList.toggle("active", i < r);
    }
}

function addReview(){

    let name = document.querySelector(".review-input").value;
    let review = document.querySelector(".review-text").value;

    if(name=="" || review=="" || selectedRating==0){
        alert("Fill all fields + rating");
        return;
    }

    let data = JSON.parse(localStorage.getItem("reviews")) || [];

    data.push({
        name:name,
        review:review,
        rating:selectedRating
    });

    localStorage.setItem("reviews", JSON.stringify(data));

    document.querySelector(".review-input").value="";
    document.querySelector(".review-text").value="";
    selectedRating=0;

    resetStars();
    showReviews();
}

function resetStars(){
    document.querySelectorAll(".star").forEach(s=>{
        s.classList.remove("active");
    });
}

function deleteReview(index){

    let data = JSON.parse(localStorage.getItem("reviews")) || [];

    data.splice(index, 1);

    localStorage.setItem("reviews", JSON.stringify(data));

    showReviews();
}

function showReviews(){

    let data = JSON.parse(localStorage.getItem("reviews")) || [];

    let box = document.getElementById("allReviews");

    box.innerHTML = "";

    data.forEach((r, index) => {

        box.innerHTML += `
            <div class="review-box">

                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h4 style="margin:0;">${r.name}</h4>
                    <span style="color:gold;">${"⭐".repeat(r.rating)}</span>
                </div>

                <p style="margin-top:8px; line-height:1.5;">
                    ${r.review}
                </p>

                <button class="delete-btn" onclick="deleteReview(${index})">
                    Delete
                </button>

            </div>
        `;
    });
}

window.onload = showReviews;

</script>

</body>
</html>
